id: codex-gpt-5.6-sol-xhigh-chatgpt
display_name: Codex + GPT-5.6 Sol xhigh (ChatGPT subscription)
system: codex
model: gpt-5.6-sol
effort: xhigh
tool_profile: deepee-kicad-toolchain
network_policy:
  profile: chatgpt_subscription
  authentication: chatgpt_subscription
  agent_egress: ["api.openai.com:443", "auth.openai.com:443", "chatgpt.com:443"]
  verifier_egress: []
pricing:
  kind: api_equivalent
  currency: USD
  model: gpt-5.6-sol
  as_of: "2026-08-17"
  source: https://developers.openai.com/api/docs/models/gpt-5.6-sol
  per_million_tokens:
    input: 5.00
    cached_input: 0.50
    output: 30.00
context_file: agents/KICAD_CONTEXT.md
runner:
  type: command
  output_format: jsonl
  stdin: "{prompt_bundle}"
  container:
    engine: docker
    image: deepee-agent:1.2.0
    verification_image: deepee-verifier:1.2.0
    workdir: /work
    network: deepee-agent-internal
    cpus: 4
    memory: 8g
    pids_limit: 512
    user: root
    mount_codex_home: false
    mount_codex_auth: true
    required_env: []
    pass_env: []
    env:
      HTTPS_PROXY: http://deepee-api-egress:3128
      https_proxy: http://deepee-api-egress:3128
      HTTP_PROXY: http://deepee-api-egress:3128
      http_proxy: http://deepee-api-egress:3128
      NO_PROXY: ""
      no_proxy: ""
  command:
    - codex
    - exec
    - --model
    - gpt-5.6-sol
    - --config
    - 'model_reasoning_effort="xhigh"'
    - --sandbox
    - danger-full-access
    - --ephemeral
    - --ignore-user-config
    - --ignore-rules
    - --skip-git-repo-check
    - --json
    - --cd
    - "{run_dir}"
    - "-"
  preflight_command:
    - codex
    - exec
    - --model
    - gpt-5.6-sol
    - --config
    - 'model_reasoning_effort="xhigh"'
    - --sandbox
    - danger-full-access
    - --ephemeral
    - --ignore-user-config
    - --ignore-rules
    - --json
    - --help
metadata:
  authentication: ChatGPT subscription cache mounted read-only from the benchmark host.
  sandbox_boundary: The agent runs without a nested CLI sandbox inside an isolated, resource-limited Docker container.
  model_source: https://developers.openai.com/api/docs/guides/latest-model.md
  authoring_policy: Submit native KiCad 10 files for schematic and PCB tasks.
