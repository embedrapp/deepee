schema_version: "2.0"
id: deepee
version: 1.2.0
status: public
license: MIT
container_platform: linux/amd64
network_policy:
  profiles:
    api_key:
      authentication: api_key
      agent_egress: ["api.openai.com:443"]
    chatgpt_subscription:
      authentication: chatgpt_subscription
      agent_egress: ["api.openai.com:443", "auth.openai.com:443", "chatgpt.com:443"]
  verifier_egress: []
images:
  agent: deepee-agent:1.2.0
  verifier: deepee-verifier:1.2.0
baseline:
  system: codex
  model: gpt-5.6-sol
  reasoning_effort: xhigh
toolchain:
  kicad: 10.0.4
  platformio: 6.1.19
score_policy:
  primary_metric: pass_at_1
  task_result: all_critical_requirements_must_pass
  diagnostic_metric: requirement_vector
  validator_release_gate: all_critical_mutants_killed
  first_publishable_attempt_only: true
