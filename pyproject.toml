[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepee-bench"
version = "1.2.0"
description = "DeepEE benchmark harness for embedded engineering agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "PyYAML==6.0.3",
  "jsonschema==4.25.1"
]

[project.scripts]
deepee = "deepee.cli:main"

[tool.setuptools.packages.find]
include = ["deepee*"]
