id: deepee-fw-003
suite: firmware
difficulty: medium
timeout_minutes: 45
required_tools: [gcc, pio]
submission_paths: [artifacts/firmware/src/bme280_temperature.c]
required_artifacts:
  - {path: artifacts/firmware/platformio.ini, kind: file}
  - {path: artifacts/firmware/include/bme280_temperature.h, kind: file}
  - {path: artifacts/firmware/src/bme280_temperature.c, kind: file}
  - {path: artifacts/firmware/src/main.cpp, kind: file}
contract_version: '2.0'
requirements:
- id: bme280-project-complete
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: bme280_project_complete
- id: bme280-integration-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: bme280_integration_unchanged
- id: bme280-integer-compensation
  description: Satisfy the verifier-owned behavioral and boundary test vectors.
  layer: behavior
  critical: true
  check: bme280_integer_compensation
- id: bme280-esp32-s2-builds
  description: Build the submitted firmware for the declared target without errors.
  layer: build
  critical: true
  check: bme280_esp32_s2_builds
checks:
  - type: artifact_presence
    name: bme280_project_complete
  - type: starter_integrity
    name: bme280_integration_unchanged
    protected_globs:
      - artifacts/firmware/include/bme280_temperature.h
      - artifacts/firmware/src/main.cpp
      - artifacts/firmware/platformio.ini
  - type: c_unit_tests
    name: bme280_integer_compensation
    sources: [artifacts/firmware/src/bme280_temperature.c]
    test_sources: [verifier/test_bme280_temperature.c]
    include_dirs: [artifacts/firmware/include]
  - type: firmware_build
    name: bme280_esp32_s2_builds
    root: artifacts/firmware
    allowed_build_systems: [platformio]
    required_files: [platformio.ini, src/main.cpp, src/bme280_temperature.c, include/bme280_temperature.h]
    output_globs: [.pio/build/**/*.elf]
    timeout_seconds: 600
