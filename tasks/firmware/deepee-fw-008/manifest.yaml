id: deepee-fw-008
suite: firmware
difficulty: hard
timeout_minutes: 60
required_tools:
- gcc
- pio
submission_paths:
- artifacts/firmware/src/ads1115_config.c
required_artifacts:
- path: artifacts/firmware/platformio.ini
  kind: file
- path: artifacts/firmware/include/ads1115_config.h
  kind: file
- path: artifacts/firmware/src/ads1115_config.c
  kind: file
- path: artifacts/firmware/src/main.cpp
  kind: file
checks:
- type: artifact_presence
  name: ads1115_config_project_complete
- type: starter_integrity
  name: ads1115_config_integration_unchanged
  protected_globs:
  - artifacts/firmware/include/ads1115_config.h
  - artifacts/firmware/src/main.cpp
  - artifacts/firmware/platformio.ini
- type: c_unit_tests
  name: ads1115_config_behavior
  sources:
  - artifacts/firmware/src/ads1115_config.c
  test_sources:
  - verifier/test_ads1115_config.c
  include_dirs:
  - artifacts/firmware/include
- type: firmware_build
  name: ads1115_config_esp32_s2_builds
  root: artifacts/firmware
  allowed_build_systems:
  - platformio
  required_files:
  - platformio.ini
  - src/main.cpp
  - src/ads1115_config.c
  - include/ads1115_config.h
  output_globs:
  - .pio/build/**/*.elf
  timeout_seconds: 600
