id: deepee-fw-009
suite: firmware
difficulty: hard
timeout_minutes: 60
required_tools:
- gcc
- pio
submission_paths:
- artifacts/firmware/src/ds18b20_scratchpad.c
required_artifacts:
- path: artifacts/firmware/platformio.ini
  kind: file
- path: artifacts/firmware/include/ds18b20_scratchpad.h
  kind: file
- path: artifacts/firmware/src/ds18b20_scratchpad.c
  kind: file
- path: artifacts/firmware/src/main.cpp
  kind: file
checks:
- type: artifact_presence
  name: ds18b20_scratchpad_project_complete
- type: starter_integrity
  name: ds18b20_scratchpad_integration_unchanged
  protected_globs:
  - artifacts/firmware/include/ds18b20_scratchpad.h
  - artifacts/firmware/src/main.cpp
  - artifacts/firmware/platformio.ini
- type: c_unit_tests
  name: ds18b20_scratchpad_behavior
  sources:
  - artifacts/firmware/src/ds18b20_scratchpad.c
  test_sources:
  - verifier/test_ds18b20_scratchpad.c
  include_dirs:
  - artifacts/firmware/include
- type: firmware_build
  name: ds18b20_scratchpad_esp32_s2_builds
  root: artifacts/firmware
  allowed_build_systems:
  - platformio
  required_files:
  - platformio.ini
  - src/main.cpp
  - src/ds18b20_scratchpad.c
  - include/ds18b20_scratchpad.h
  output_globs:
  - .pio/build/**/*.elf
  timeout_seconds: 600
