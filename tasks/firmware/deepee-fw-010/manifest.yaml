id: deepee-fw-010
suite: firmware
difficulty: hard
timeout_minutes: 60
required_tools:
- gcc
- pio
submission_paths:
- artifacts/firmware/src/scd4x_measurement.c
required_artifacts:
- path: artifacts/firmware/platformio.ini
  kind: file
- path: artifacts/firmware/include/scd4x_measurement.h
  kind: file
- path: artifacts/firmware/src/scd4x_measurement.c
  kind: file
- path: artifacts/firmware/src/main.cpp
  kind: file
contract_version: '2.0'
requirements:
- id: scd4x-measurement-project-complete
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: scd4x_measurement_project_complete
- id: scd4x-measurement-integration-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: scd4x_measurement_integration_unchanged
- id: scd4x-measurement-behavior
  description: Satisfy the verifier-owned behavioral and boundary test vectors.
  layer: behavior
  critical: true
  check: scd4x_measurement_behavior
- id: scd4x-measurement-esp32-s2-builds
  description: Build the submitted firmware for the declared target without errors.
  layer: build
  critical: true
  check: scd4x_measurement_esp32_s2_builds
checks:
- type: artifact_presence
  name: scd4x_measurement_project_complete
- type: starter_integrity
  name: scd4x_measurement_integration_unchanged
  protected_globs:
  - artifacts/firmware/include/scd4x_measurement.h
  - artifacts/firmware/src/main.cpp
  - artifacts/firmware/platformio.ini
- type: c_unit_tests
  name: scd4x_measurement_behavior
  sources:
  - artifacts/firmware/src/scd4x_measurement.c
  test_sources:
  - verifier/test_scd4x_measurement.c
  include_dirs:
  - artifacts/firmware/include
- type: firmware_build
  name: scd4x_measurement_esp32_s2_builds
  root: artifacts/firmware
  allowed_build_systems:
  - platformio
  required_files:
  - platformio.ini
  - src/main.cpp
  - src/scd4x_measurement.c
  - include/scd4x_measurement.h
  output_globs:
  - .pio/build/**/*.elf
  timeout_seconds: 600
