id: deepee-fw-011
suite: firmware
difficulty: hard
timeout_minutes: 60
required_tools:
- gcc
- pio
submission_paths:
- artifacts/firmware/src/pca9685_timing.c
required_artifacts:
- path: artifacts/firmware/platformio.ini
  kind: file
- path: artifacts/firmware/include/pca9685_timing.h
  kind: file
- path: artifacts/firmware/src/pca9685_timing.c
  kind: file
- path: artifacts/firmware/src/main.cpp
  kind: file
contract_version: '2.0'
requirements:
- id: pca9685-timing-project-complete
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: pca9685_timing_project_complete
- id: pca9685-timing-integration-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: pca9685_timing_integration_unchanged
- id: pca9685-timing-behavior
  description: Satisfy the verifier-owned behavioral and boundary test vectors.
  layer: behavior
  critical: true
  check: pca9685_timing_behavior
- id: pca9685-timing-esp32-s2-builds
  description: Build the submitted firmware for the declared target without errors.
  layer: build
  critical: true
  check: pca9685_timing_esp32_s2_builds
checks:
- type: artifact_presence
  name: pca9685_timing_project_complete
- type: starter_integrity
  name: pca9685_timing_integration_unchanged
  protected_globs:
  - artifacts/firmware/include/pca9685_timing.h
  - artifacts/firmware/src/main.cpp
  - artifacts/firmware/platformio.ini
- type: c_unit_tests
  name: pca9685_timing_behavior
  sources:
  - artifacts/firmware/src/pca9685_timing.c
  test_sources:
  - verifier/test_pca9685_timing.c
  include_dirs:
  - artifacts/firmware/include
- type: firmware_build
  name: pca9685_timing_esp32_s2_builds
  root: artifacts/firmware
  allowed_build_systems:
  - platformio
  required_files:
  - platformio.ini
  - src/main.cpp
  - src/pca9685_timing.c
  - include/pca9685_timing.h
  output_globs:
  - .pio/build/**/*.elf
  timeout_seconds: 600
