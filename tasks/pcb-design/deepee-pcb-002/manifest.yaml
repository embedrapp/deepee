id: deepee-pcb-002
suite: pcb-design
difficulty: hard
timeout_minutes: 90
required_tools: [kicad-cli]
submission_paths: [artifacts/mcp9808-breakout.kicad_pcb]
required_artifacts:
  - {path: artifacts/mcp9808-breakout.kicad_pcb, kind: file}
contract_version: '2.0'
requirements:
- id: designed-board-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: designed_board_exists
- id: breakout-board-contract
  description: Satisfy the declared native PCB structure and routing contract.
  layer: physical
  critical: true
  check: breakout_board_contract
- id: clean-drc
  description: Pass KiCad design-rules checking without errors or warnings.
  layer: manufacturability
  critical: true
  check: clean_drc
checks:
  - type: artifact_presence
    name: designed_board_exists
  - type: kicad_pcb_structure
    name: breakout_board_contract
    board: artifacts/mcp9808-breakout.kicad_pcb
    copper_layers: 2
    expected_width_mm: 18
    expected_height_mm: 15
    tolerance_mm: 0.05
    min_footprints: 6
    min_tracks: 0
    require_ground_zone: true
    exact_references: true
    components:
      - {reference: U1, value: MCP9808T-E/MS, footprint: "Package_SO:MSOP-8_3x3mm_P0.65mm"}
      - {reference: R1, value: 4.7k, footprint: "Resistor_SMD:R_0603_1608Metric"}
      - {reference: R2, value: 4.7k, footprint: "Resistor_SMD:R_0603_1608Metric"}
      - {reference: R3, value: 10k, footprint: "Resistor_SMD:R_0603_1608Metric"}
      - {reference: C1, value: 100nF, footprint: "Capacitor_SMD:C_0603_1608Metric"}
      - {reference: J1, value: Conn_01x05, footprint: "Connector_PinHeader_2.54mm:PinHeader_1x05_P2.54mm_Vertical"}
    pin_nets:
      U1.1: SDA
      U1.2: SCL
      U1.3: ALERT
      U1.4: GND
      U1.5: GND
      U1.6: GND
      U1.7: GND
      U1.8: "3V3"
      R1.1: "3V3"
      R1.2: SDA
      R2.1: "3V3"
      R2.2: SCL
      R3.1: "3V3"
      R3.2: ALERT
      C1.1: "3V3"
      C1.2: GND
      J1.1: "3V3"
      J1.2: GND
      J1.3: SDA
      J1.4: SCL
      J1.5: ALERT
    required_routed_nets: ["3V3", GND, SDA, SCL, ALERT]
    track_width_constraints:
      - name: all-required-nets
        nets:
          - 3V3
          - GND
          - SDA
          - SCL
          - ALERT
        minimum_mm: 0.25
  - type: kicad_drc
    name: clean_drc
    board: artifacts/mcp9808-breakout.kicad_pcb
