id: deepee-pcb-008
suite: pcb-design
difficulty: hard
timeout_minutes: 120
required_tools:
- kicad-cli
submission_paths:
- artifacts/max3485-rs485.kicad_pcb
required_artifacts:
- path: artifacts/max3485-rs485.kicad_pcb
  kind: file
- path: artifacts/max3485-rs485.kicad_pro
  kind: file
checks:
- type: artifact_presence
  name: completed_board_exists
- type: starter_integrity
  name: project_rules_unchanged
  protected_globs:
  - artifacts/max3485-rs485.kicad_pro
- type: kicad_pcb_structure
  name: layout_contract
  board: artifacts/max3485-rs485.kicad_pcb
  copper_layers: 2
  expected_width_mm: 60
  expected_height_mm: 40
  tolerance_mm: 0.05
  min_footprints: 7
  min_tracks: 8
  exact_references: true
  components:
  - reference: U1
    value: MAX3485
    footprint: Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
  - reference: R1
    value: 120R
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R2
    value: 680R
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R3
    value: 680R
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: C1
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: J1
    value: Conn_01x06
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x06_P2.54mm_Vertical
  - reference: J2
    value: Conn_01x03
    footprint: TerminalBlock_RND:TerminalBlock_RND_205-00288_1x03_P5.08mm_Horizontal
  pin_nets:
    U1.1: RO
    U1.2: RE_N
    U1.3: DE
    U1.4: DI
    U1.5: GND
    U1.6: A
    U1.7: B
    U1.8: 3V3
    R1.1: A
    R1.2: B
    R2.1: 3V3
    R2.2: A
    R3.1: B
    R3.2: GND
    C1.1: 3V3
    C1.2: GND
    J1.1: 3V3
    J1.2: GND
    J1.3: RO
    J1.4: RE_N
    J1.5: DE
    J1.6: DI
    J2.1: A
    J2.2: B
    J2.3: GND
  required_routed_nets:
  - RO
  - RE_N
  - DE
  - DI
  - GND
  - A
  - B
  - 3V3
- type: kicad_drc
  name: clean_drc
  board: artifacts/max3485-rs485.kicad_pcb
