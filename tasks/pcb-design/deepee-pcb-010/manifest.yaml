id: deepee-pcb-010
suite: pcb-design
difficulty: hard
timeout_minutes: 120
required_tools:
- kicad-cli
submission_paths:
- artifacts/pca9306-i2c-level-shifter.kicad_pcb
required_artifacts:
- path: artifacts/pca9306-i2c-level-shifter.kicad_pcb
  kind: file
- path: artifacts/pca9306-i2c-level-shifter.kicad_pro
  kind: file
contract_version: '2.0'
requirements:
- id: completed-board-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: completed_board_exists
- id: project-rules-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: project_rules_unchanged
- id: layout-contract
  description: Satisfy the declared native PCB structure and routing contract.
  layer: physical
  critical: true
  check: layout_contract
- id: clean-drc
  description: Pass KiCad design-rules checking without errors or warnings.
  layer: manufacturability
  critical: true
  check: clean_drc
checks:
- type: artifact_presence
  name: completed_board_exists
- type: starter_integrity
  name: project_rules_unchanged
  protected_globs:
  - artifacts/pca9306-i2c-level-shifter.kicad_pro
- type: kicad_pcb_structure
  name: layout_contract
  board: artifacts/pca9306-i2c-level-shifter.kicad_pcb
  copper_layers: 2
  expected_width_mm: 60
  expected_height_mm: 40
  tolerance_mm: 0.05
  min_footprints: 10
  min_tracks: 8
  exact_references: true
  components:
  - reference: U1
    value: PCA9306D
    footprint: Package_SO:TSSOP-8_3x3mm_P0.65mm
  - reference: R1
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R2
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R3
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R4
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R5
    value: 200k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: C1
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: C2
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: J1
    value: Conn_01x04
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  - reference: J2
    value: Conn_01x04
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  pin_nets:
    U1.1: GND
    U1.2: 1V8
    U1.3: SCL_1V8
    U1.4: SDA_1V8
    U1.5: SDA_3V3
    U1.6: SCL_3V3
    U1.7: 3V3
    U1.8: ENABLE
    R1.1: 1V8
    R1.2: SDA_1V8
    R2.1: 1V8
    R2.2: SCL_1V8
    R3.1: 3V3
    R3.2: SDA_3V3
    R4.1: 3V3
    R4.2: SCL_3V3
    R5.1: ENABLE
    R5.2: 3V3
    C1.1: 1V8
    C1.2: GND
    C2.1: 3V3
    C2.2: GND
    J1.1: 1V8
    J1.2: GND
    J1.3: SDA_1V8
    J1.4: SCL_1V8
    J2.1: 3V3
    J2.2: GND
    J2.3: SDA_3V3
    J2.4: SCL_3V3
  required_routed_nets:
  - GND
  - 1V8
  - SCL_1V8
  - SDA_1V8
  - SDA_3V3
  - SCL_3V3
  - 3V3
  - ENABLE
- type: kicad_drc
  name: clean_drc
  board: artifacts/pca9306-i2c-level-shifter.kicad_pcb
