id: deepee-pcb-011
suite: pcb-design
difficulty: hard
timeout_minutes: 120
required_tools:
- kicad-cli
submission_paths:
- artifacts/microsd-spi-adapter.kicad_pcb
required_artifacts:
- path: artifacts/microsd-spi-adapter.kicad_pcb
  kind: file
- path: artifacts/microsd-spi-adapter.kicad_pro
  kind: file
contract_version: '2.0'
requirements:
- id: completed-board-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: completed_board_exists
- id: project-rules-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: project_rules_unchanged
- id: layout-contract
  description: Satisfy the declared native PCB structure and routing contract.
  layer: physical
  critical: true
  check: layout_contract
- id: clean-drc
  description: Pass KiCad design-rules checking without errors or warnings.
  layer: manufacturability
  critical: true
  check: clean_drc
checks:
- type: artifact_presence
  name: completed_board_exists
- type: starter_integrity
  name: project_rules_unchanged
  protected_globs:
  - artifacts/microsd-spi-adapter.kicad_pro
- type: kicad_pcb_structure
  name: layout_contract
  board: artifacts/microsd-spi-adapter.kicad_pcb
  copper_layers: 2
  expected_width_mm: 60
  expected_height_mm: 40
  tolerance_mm: 0.05
  min_footprints: 7
  min_tracks: 8
  exact_references: true
  components:
  - reference: J1
    value: Micro_SD_Card
    footprint: Connector_Card:microSD_HC_Hirose_DM3AT-SF-PEJM5
  - reference: R1
    value: 47k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R2
    value: 47k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R3
    value: 47k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: C1
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: C2
    value: 10uF
    footprint: Capacitor_SMD:C_0805_2012Metric
  - reference: J2
    value: Conn_01x06
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x06_P2.54mm_Vertical
  pin_nets:
    J1.1: DAT2
    J1.2: SD_CS
    J1.3: MOSI
    J1.4: 3V3
    J1.5: SCK
    J1.6: GND
    J1.7: MISO
    J1.8: DAT1
    J1.SH: GND
    R1.1: 3V3
    R1.2: SD_CS
    R2.1: 3V3
    R2.2: DAT1
    R3.1: 3V3
    R3.2: DAT2
    C1.1: 3V3
    C1.2: GND
    C2.1: 3V3
    C2.2: GND
    J2.1: 3V3
    J2.2: GND
    J2.3: SD_CS
    J2.4: MOSI
    J2.5: MISO
    J2.6: SCK
  required_routed_nets:
  - DAT2
  - SD_CS
  - MOSI
  - 3V3
  - SCK
  - GND
  - MISO
  - DAT1
- type: kicad_drc
  name: clean_drc
  board: artifacts/microsd-spi-adapter.kicad_pcb
