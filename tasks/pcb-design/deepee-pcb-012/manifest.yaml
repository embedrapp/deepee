id: deepee-pcb-012
suite: pcb-design
difficulty: hard
timeout_minutes: 120
required_tools:
- kicad-cli
submission_paths:
- artifacts/ne555-astable.kicad_pcb
required_artifacts:
- path: artifacts/ne555-astable.kicad_pcb
  kind: file
- path: artifacts/ne555-astable.kicad_pro
  kind: file
contract_version: '2.0'
requirements:
- id: completed-board-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: completed_board_exists
- id: project-rules-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: project_rules_unchanged
- id: layout-contract
  description: Satisfy the declared native PCB structure and routing contract.
  layer: physical
  critical: true
  check: layout_contract
- id: clean-drc
  description: Pass KiCad design-rules checking without errors or warnings.
  layer: manufacturability
  critical: true
  check: clean_drc
checks:
- type: artifact_presence
  name: completed_board_exists
- type: starter_integrity
  name: project_rules_unchanged
  protected_globs:
  - artifacts/ne555-astable.kicad_pro
- type: kicad_pcb_structure
  name: layout_contract
  board: artifacts/ne555-astable.kicad_pcb
  copper_layers: 2
  expected_width_mm: 60
  expected_height_mm: 40
  tolerance_mm: 0.05
  min_footprints: 7
  min_tracks: 6
  exact_references: true
  components:
  - reference: U1
    value: NE555D
    footprint: Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
  - reference: R1
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R2
    value: 68k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: C1
    value: 10nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: C2
    value: 10nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: C3
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: J1
    value: Conn_01x03
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical
  pin_nets:
    U1.1: GND
    U1.2: TIMING
    U1.3: OUT
    U1.4: 5V
    U1.5: CTRL
    U1.6: TIMING
    U1.7: DISCHARGE
    U1.8: 5V
    R1.1: 5V
    R1.2: DISCHARGE
    R2.1: DISCHARGE
    R2.2: TIMING
    C1.1: TIMING
    C1.2: GND
    C2.1: CTRL
    C2.2: GND
    C3.1: 5V
    C3.2: GND
    J1.1: 5V
    J1.2: GND
    J1.3: OUT
  required_routed_nets:
  - GND
  - TIMING
  - OUT
  - 5V
  - CTRL
  - DISCHARGE
  track_width_constraints:
    - name: all-required-nets
      nets:
        - GND
        - TIMING
        - OUT
        - 5V
        - CTRL
        - DISCHARGE
      minimum_mm: 0.25
- type: kicad_drc
  name: clean_drc
  board: artifacts/ne555-astable.kicad_pcb
