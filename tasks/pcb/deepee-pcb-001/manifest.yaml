id: deepee-pcb-001
suite: pcb
difficulty: medium
timeout_minutes: 60
required_tools: [kicad-cli]
submission_paths: [artifacts/nrf24-adapter.kicad_pcb]
required_artifacts:
  - {path: artifacts/nrf24-adapter.kicad_pcb, kind: file}
contract_version: '2.0'
requirements:
- id: completed-board-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: completed_board_exists
- id: adapter-contract
  description: Satisfy the declared native PCB structure and routing contract.
  layer: physical
  critical: true
  check: adapter_contract
- id: clean-drc
  description: Pass KiCad design-rules checking without errors or warnings.
  layer: manufacturability
  critical: true
  check: clean_drc
checks:
  - type: artifact_presence
    name: completed_board_exists
  - type: kicad_pcb_structure
    name: adapter_contract
    board: artifacts/nrf24-adapter.kicad_pcb
    copper_layers: 2
    expected_width_mm: 30
    expected_height_mm: 25
    tolerance_mm: 0.05
    min_footprints: 4
    min_tracks: 0
    exact_references: true
    components:
      - {reference: J1, value: Conn_01x08, footprint: "Connector_PinHeader_2.54mm:PinHeader_1x08_P2.54mm_Vertical"}
      - {reference: J2, value: nRF24L01_Module, footprint: "Connector_PinSocket_2.54mm:PinSocket_2x04_P2.54mm_Vertical"}
      - {reference: C1, value: 10uF, footprint: "Capacitor_SMD:C_0805_2012Metric"}
      - {reference: C2, value: 100nF, footprint: "Capacitor_SMD:C_0603_1608Metric"}
    pin_nets:
      J1.1: GND
      J1.2: +3V3
      J1.3: CE
      J1.4: CSN
      J1.5: SCK
      J1.6: MOSI
      J1.7: MISO
      J1.8: IRQ
      J2.1: GND
      J2.2: +3V3
      J2.3: CE
      J2.4: CSN
      J2.5: SCK
      J2.6: MOSI
      J2.7: MISO
      J2.8: IRQ
      C1.1: +3V3
      C1.2: GND
      C2.1: +3V3
      C2.2: GND
    required_routed_nets: [GND, "\\+3V3", CE, CSN, SCK, MOSI, MISO, IRQ]
    track_width_constraints:
      - name: all-required-nets
        nets:
          - GND
          - \+3V3
          - CE
          - CSN
          - SCK
          - MOSI
          - MISO
          - IRQ
        minimum_mm: 0.25
  - type: kicad_drc
    name: clean_drc
    board: artifacts/nrf24-adapter.kicad_pcb
