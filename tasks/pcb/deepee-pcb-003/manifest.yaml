id: deepee-pcb-003
suite: pcb
difficulty: hard
timeout_minutes: 120
required_tools:
- kicad-cli
submission_paths:
- artifacts/ina219-current-monitor.kicad_pcb
required_artifacts:
- path: artifacts/ina219-current-monitor.kicad_pcb
  kind: file
- path: artifacts/ina219-current-monitor.kicad_pro
  kind: file
contract_version: '2.0'
requirements:
- id: completed-board-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: completed_board_exists
- id: project-rules-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: project_rules_unchanged
- id: layout-contract
  description: Satisfy the declared native PCB structure and routing contract.
  layer: physical
  critical: true
  check: layout_contract
- id: clean-drc
  description: Pass KiCad design-rules checking without errors or warnings.
  layer: manufacturability
  critical: true
  check: clean_drc
checks:
- type: artifact_presence
  name: completed_board_exists
- type: starter_integrity
  name: project_rules_unchanged
  protected_globs:
  - artifacts/ina219-current-monitor.kicad_pro
- type: kicad_pcb_structure
  name: layout_contract
  board: artifacts/ina219-current-monitor.kicad_pcb
  copper_layers: 2
  expected_width_mm: 60
  expected_height_mm: 40
  tolerance_mm: 0.05
  min_footprints: 6
  min_tracks: 6
  exact_references: true
  components:
  - reference: U1
    value: INA219AxD
    footprint: Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
  - reference: R1
    value: 0.1R
    footprint: Resistor_SMD:R_2512_6332Metric
  - reference: R2
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R3
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: C1
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: J1
    value: Conn_01x06
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x06_P2.54mm_Vertical
  pin_nets:
    U1.1: GND
    U1.2: GND
    U1.3: SDA
    U1.4: SCL
    U1.5: 3V3
    U1.6: GND
    U1.7: VIN_OUT
    U1.8: VIN_IN
    R1.1: VIN_IN
    R1.2: VIN_OUT
    R2.1: 3V3
    R2.2: SDA
    R3.1: 3V3
    R3.2: SCL
    C1.1: 3V3
    C1.2: GND
    J1.1: VIN_IN
    J1.2: VIN_OUT
    J1.3: 3V3
    J1.4: GND
    J1.5: SDA
    J1.6: SCL
  required_routed_nets:
  - GND
  - SDA
  - SCL
  - 3V3
  - VIN_OUT
  - VIN_IN
- type: kicad_drc
  name: clean_drc
  board: artifacts/ina219-current-monitor.kicad_pcb
