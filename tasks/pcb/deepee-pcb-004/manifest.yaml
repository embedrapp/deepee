id: deepee-pcb-004
suite: pcb
difficulty: hard
timeout_minutes: 120
required_tools:
- kicad-cli
submission_paths:
- artifacts/ads1115-analog-input.kicad_pcb
required_artifacts:
- path: artifacts/ads1115-analog-input.kicad_pcb
  kind: file
- path: artifacts/ads1115-analog-input.kicad_pro
  kind: file
checks:
- type: artifact_presence
  name: completed_board_exists
- type: starter_integrity
  name: project_rules_unchanged
  protected_globs:
  - artifacts/ads1115-analog-input.kicad_pro
- type: kicad_pcb_structure
  name: layout_contract
  board: artifacts/ads1115-analog-input.kicad_pcb
  copper_layers: 2
  expected_width_mm: 60
  expected_height_mm: 40
  tolerance_mm: 0.05
  min_footprints: 6
  min_tracks: 9
  exact_references: true
  components:
  - reference: U1
    value: ADS1115IDGS
    footprint: Package_SO:TSSOP-10_3x3mm_P0.5mm
  - reference: R1
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R2
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R3
    value: 10k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: C1
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: J1
    value: Conn_01x10
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x10_P2.54mm_Vertical
  pin_nets:
    U1.1: GND
    U1.2: ALERT
    U1.3: GND
    U1.4: AIN0
    U1.5: AIN1
    U1.6: AIN2
    U1.7: AIN3
    U1.8: 3V3
    U1.9: SDA
    U1.10: SCL
    R1.1: 3V3
    R1.2: SDA
    R2.1: 3V3
    R2.2: SCL
    R3.1: 3V3
    R3.2: ALERT
    C1.1: 3V3
    C1.2: GND
    J1.1: 3V3
    J1.2: GND
    J1.3: SDA
    J1.4: SCL
    J1.5: ALERT
    J1.6: AIN0
    J1.7: AIN1
    J1.8: AIN2
    J1.9: AIN3
    J1.10: GND
  required_routed_nets:
  - GND
  - ALERT
  - AIN0
  - AIN1
  - AIN2
  - AIN3
  - 3V3
  - SDA
  - SCL
- type: kicad_drc
  name: clean_drc
  board: artifacts/ads1115-analog-input.kicad_pcb
