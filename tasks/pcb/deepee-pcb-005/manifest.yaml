id: deepee-pcb-005
suite: pcb
difficulty: hard
timeout_minutes: 120
required_tools:
- kicad-cli
submission_paths:
- artifacts/bmp280-environment-sensor.kicad_pcb
required_artifacts:
- path: artifacts/bmp280-environment-sensor.kicad_pcb
  kind: file
- path: artifacts/bmp280-environment-sensor.kicad_pro
  kind: file
contract_version: '2.0'
requirements:
- id: completed-board-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: completed_board_exists
- id: project-rules-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: project_rules_unchanged
- id: layout-contract
  description: Satisfy the declared native PCB structure and routing contract.
  layer: physical
  critical: true
  check: layout_contract
- id: clean-drc
  description: Pass KiCad design-rules checking without errors or warnings.
  layer: manufacturability
  critical: true
  check: clean_drc
checks:
- type: artifact_presence
  name: completed_board_exists
- type: starter_integrity
  name: project_rules_unchanged
  protected_globs:
  - artifacts/bmp280-environment-sensor.kicad_pro
- type: kicad_pcb_structure
  name: layout_contract
  board: artifacts/bmp280-environment-sensor.kicad_pcb
  copper_layers: 2
  expected_width_mm: 60
  expected_height_mm: 40
  tolerance_mm: 0.05
  min_footprints: 7
  min_tracks: 5
  exact_references: true
  components:
  - reference: U1
    value: BMP280
    footprint: Package_LGA:Bosch_LGA-8_2x2.5mm_P0.65mm_ClockwisePinNumbering
  - reference: R1
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R2
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R3
    value: 0R
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: C1
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: C2
    value: 1uF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: J1
    value: Conn_01x04
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  pin_nets:
    U1.1: GND
    U1.2: 3V3
    U1.3: SDA
    U1.4: SCL
    U1.5: ADDR
    U1.6: 3V3
    U1.7: GND
    U1.8: 3V3
    R1.1: 3V3
    R1.2: SDA
    R2.1: 3V3
    R2.2: SCL
    R3.1: ADDR
    R3.2: GND
    C1.1: 3V3
    C1.2: GND
    C2.1: 3V3
    C2.2: GND
    J1.1: 3V3
    J1.2: GND
    J1.3: SDA
    J1.4: SCL
  required_routed_nets:
  - GND
  - 3V3
  - SDA
  - SCL
  - ADDR
- type: kicad_drc
  name: clean_drc
  board: artifacts/bmp280-environment-sensor.kicad_pcb
