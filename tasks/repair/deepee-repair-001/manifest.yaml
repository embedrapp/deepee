id: deepee-repair-001
suite: repair
difficulty: easy
timeout_minutes: 30
required_tools: [gcc]
submission_paths: [firmware/src/scheduler.c]
required_artifacts:
  - {path: firmware/src/scheduler.c, kind: file}
contract_version: '2.0'
requirements:
- id: repaired-source-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: repaired_source_exists
- id: scheduler-contract-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: scheduler_contract_unchanged
- id: rollover-safe-scheduler-behavior
  description: Satisfy the verifier-owned behavioral and boundary test vectors.
  layer: behavior
  critical: true
  check: rollover_safe_scheduler_behavior
checks:
  - type: artifact_presence
    name: repaired_source_exists
  - type: starter_integrity
    name: scheduler_contract_unchanged
    protected_globs:
      - firmware/src/scheduler.h
      - firmware/Makefile
  - type: c_unit_tests
    name: rollover_safe_scheduler_behavior
    sources: [firmware/src/scheduler.c]
    test_sources: [verifier/test_scheduler.c]
    include_dirs: [firmware/src]
