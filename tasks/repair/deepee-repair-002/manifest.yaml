id: deepee-repair-002
suite: repair
difficulty: medium
timeout_minutes: 30
required_tools: [gcc]
submission_paths: [firmware/src/ring_buffer.c]
required_artifacts:
  - {path: firmware/src/ring_buffer.c, kind: file}
contract_version: '2.0'
requirements:
- id: repaired-ring-buffer-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: repaired_ring_buffer_exists
- id: ring-buffer-contract-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: ring_buffer_contract_unchanged
- id: wrapped-fifo-behavior
  description: Satisfy the verifier-owned behavioral and boundary test vectors.
  layer: behavior
  critical: true
  check: wrapped_fifo_behavior
checks:
  - type: artifact_presence
    name: repaired_ring_buffer_exists
  - type: starter_integrity
    name: ring_buffer_contract_unchanged
    protected_globs:
      - firmware/src/ring_buffer.h
      - firmware/Makefile
  - type: c_unit_tests
    name: wrapped_fifo_behavior
    sources: [firmware/src/ring_buffer.c]
    test_sources: [verifier/test_ring_buffer.c]
    include_dirs: [firmware/src]
