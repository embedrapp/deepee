id: deepee-repair-007
suite: repair
difficulty: hard
timeout_minutes: 45
required_tools:
- gcc
submission_paths:
- firmware/src/cbor_uint.c
required_artifacts:
- path: firmware/src/cbor_uint.c
  kind: file
contract_version: '2.0'
requirements:
- id: repaired-cbor-uint-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: repaired_cbor_uint_exists
- id: cbor-uint-contract-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: cbor_uint_contract_unchanged
- id: cbor-uint-behavior
  description: Satisfy the verifier-owned behavioral and boundary test vectors.
  layer: behavior
  critical: true
  check: cbor_uint_behavior
checks:
- type: artifact_presence
  name: repaired_cbor_uint_exists
- type: starter_integrity
  name: cbor_uint_contract_unchanged
  protected_globs:
  - firmware/src/cbor_uint.h
  - firmware/Makefile
- type: c_unit_tests
  name: cbor_uint_behavior
  sources:
  - firmware/src/cbor_uint.c
  test_sources:
  - verifier/test_cbor_uint.c
  include_dirs:
  - firmware/src
