id: deepee-sch-002
suite: schematic-design
difficulty: medium
timeout_minutes: 60
required_tools: [kicad-cli]
submission_paths: [artifacts/mcp9808-breakout.kicad_sch]
required_artifacts:
  - {path: artifacts/mcp9808-breakout.kicad_sch, kind: file}
contract_version: '2.0'
requirements:
- id: designed-schematic-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: designed_schematic_exists
- id: breakout-component-contract
  description: Satisfy the declared native schematic component and net contract.
  layer: logical
  critical: true
  check: breakout_component_contract
- id: breakout-connectivity
  description: Satisfy the independently exported electrical netlist contract.
  layer: logical
  critical: true
  check: breakout_connectivity
- id: clean-erc
  description: Pass KiCad electrical-rules checking without errors or warnings.
  layer: electrical
  critical: true
  check: clean_erc
checks:
  - type: artifact_presence
    name: designed_schematic_exists
  - type: kicad_schematic_structure
    name: breakout_component_contract
    schematic: artifacts/mcp9808-breakout.kicad_sch
    min_symbols: 6
    min_wires: 0
    exact_references: true
    components:
      - {reference: U1, value: MCP9808T-E/MS, library: "Sensor_Temperature:MCP9808_MSOP", footprint: "Package_SO:MSOP-8_3x3mm_P0.65mm"}
      - {reference: R1, value: 4.7k, library: "Device:R", footprint: "Resistor_SMD:R_0603_1608Metric"}
      - {reference: R2, value: 4.7k, library: "Device:R", footprint: "Resistor_SMD:R_0603_1608Metric"}
      - {reference: R3, value: 10k, library: "Device:R", footprint: "Resistor_SMD:R_0603_1608Metric"}
      - {reference: C1, value: 100nF, library: "Device:C", footprint: "Capacitor_SMD:C_0603_1608Metric"}
      - {reference: J1, value: Conn_01x05, library: "Connector_Generic:Conn_01x05", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x05_P2.54mm_Vertical"}
    required_nets: ["3V3", GND, SDA, SCL, ALERT]
  - type: kicad_netlist_contract
    name: breakout_connectivity
    schematic: artifacts/mcp9808-breakout.kicad_sch
    exact_references: true
    components:
      - {reference: U1, value: MCP9808T-E/MS, footprint: "Package_SO:MSOP-8_3x3mm_P0.65mm"}
      - {reference: R1, value: 4.7k, footprint: "Resistor_SMD:R_0603_1608Metric"}
      - {reference: R2, value: 4.7k, footprint: "Resistor_SMD:R_0603_1608Metric"}
      - {reference: R3, value: 10k, footprint: "Resistor_SMD:R_0603_1608Metric"}
      - {reference: C1, value: 100nF, footprint: "Capacitor_SMD:C_0603_1608Metric"}
      - {reference: J1, value: Conn_01x05, footprint: "Connector_PinHeader_2.54mm:PinHeader_1x05_P2.54mm_Vertical"}
    pin_nets:
      U1.1: SDA
      U1.2: SCL
      U1.3: ALERT
      U1.4: GND
      U1.5: GND
      U1.6: GND
      U1.7: GND
      U1.8: "3V3"
      R1.1: "3V3"
      R1.2: SDA
      R2.1: "3V3"
      R2.2: SCL
      R3.1: "3V3"
      R3.2: ALERT
      C1.1: "3V3"
      C1.2: GND
      J1.1: "3V3"
      J1.2: GND
      J1.3: SDA
      J1.4: SCL
      J1.5: ALERT
  - type: kicad_erc
    name: clean_erc
    schematic: artifacts/mcp9808-breakout.kicad_sch
