id: deepee-sch-008
suite: schematic-design
difficulty: hard
timeout_minutes: 90
required_tools:
- kicad-cli
submission_paths:
- artifacts/max3485-rs485.kicad_sch
required_artifacts:
- path: artifacts/max3485-rs485.kicad_sch
  kind: file
- path: artifacts/max3485-rs485.kicad_pro
  kind: file
contract_version: '2.0'
requirements:
- id: completed-schematic-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: completed_schematic_exists
- id: project-rules-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: project_rules_unchanged
- id: component-and-net-contract
  description: Satisfy the declared native schematic component and net contract.
  layer: logical
  critical: true
  check: component_and_net_contract
- id: pin-connectivity
  description: Satisfy the independently exported electrical netlist contract.
  layer: logical
  critical: true
  check: pin_connectivity
- id: clean-erc
  description: Pass KiCad electrical-rules checking without errors or warnings.
  layer: electrical
  critical: true
  check: clean_erc
checks:
- type: artifact_presence
  name: completed_schematic_exists
- type: starter_integrity
  name: project_rules_unchanged
  protected_globs:
  - artifacts/max3485-rs485.kicad_pro
- type: kicad_schematic_structure
  name: component_and_net_contract
  schematic: artifacts/max3485-rs485.kicad_sch
  min_symbols: 7
  min_wires: 0
  exact_references: true
  components:
  - reference: U1
    value: MAX3485
    footprint: Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
    library: Interface_UART:MAX3485
  - reference: R1
    value: 120R
    footprint: Resistor_SMD:R_0603_1608Metric
    library: Device:R
  - reference: R2
    value: 680R
    footprint: Resistor_SMD:R_0603_1608Metric
    library: Device:R
  - reference: R3
    value: 680R
    footprint: Resistor_SMD:R_0603_1608Metric
    library: Device:R
  - reference: C1
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
    library: Device:C
  - reference: J1
    value: Conn_01x06
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x06_P2.54mm_Vertical
    library: Connector_Generic:Conn_01x06
  - reference: J2
    value: Conn_01x03
    footprint: TerminalBlock_RND:TerminalBlock_RND_205-00288_1x03_P5.08mm_Horizontal
    library: Connector_Generic:Conn_01x03
  required_nets:
