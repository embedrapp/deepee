id: deepee-sch-012
suite: schematic-design
difficulty: hard
timeout_minutes: 90
required_tools:
- kicad-cli
submission_paths:
- artifacts/ne555-astable.kicad_sch
required_artifacts:
- path: artifacts/ne555-astable.kicad_sch
  kind: file
- path: artifacts/ne555-astable.kicad_pro
  kind: file
