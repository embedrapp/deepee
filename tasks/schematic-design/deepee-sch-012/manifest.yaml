- type: kicad_schematic_structure
  name: component_and_net_contract
  schematic: artifacts/ne555-astable.kicad_sch
  min_symbols: 7
  min_wires: 0
  exact_references: true
  components:
  - reference: U1
    value: NE555D
    footprint: Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
    library: Timer:NE555D
  - reference: R1
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
    library: Device:R
  - reference: R2
    value: 68k
    footprint: Resistor_SMD:R_0603_1608Metric
    library: Device:R
  - reference: C1
    value: 10nF
    footprint: Capacitor_SMD:C_0603_1608Metric
    library: Device:C
  - reference: C2
    value: 10nF
    footprint: Capacitor_SMD:C_0603_1608Metric
    library: Device:C
  - reference: C3
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
    library: Device:C
  - reference: J1
    value: Conn_01x03
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical
    library: Connector_Generic:Conn_01x03
  required_nets:
  - GND
  - TIMING
  - OUT
  - 5V
  - CTRL
  - DISCHARGE
- type: kicad_netlist_contract
  name: pin_connectivity
  schematic: artifacts/ne555-astable.kicad_sch
  exact_references: true
  components:
  - reference: U1
    value: NE555D
    footprint: Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
  - reference: R1
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R2
    value: 68k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: C1
    value: 10nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: C2
    value: 10nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: C3
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: J1
    value: Conn_01x03
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical
  pin_nets:
    U1.1: GND
    U1.2: TIMING
    U1.3: OUT
    U1.4: 5V
    U1.5: CTRL
    U1.6: TIMING
    U1.7: DISCHARGE
    U1.8: 5V
    R1.1: 5V
    R1.2: DISCHARGE
    R2.1: DISCHARGE
    R2.2: TIMING
