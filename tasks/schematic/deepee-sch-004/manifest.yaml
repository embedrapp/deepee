id: deepee-sch-004
suite: schematic
difficulty: hard
timeout_minutes: 90
required_tools:
- kicad-cli
submission_paths:
- artifacts/ads1115-analog-input.kicad_sch
required_artifacts:
- path: artifacts/ads1115-analog-input.kicad_sch
  kind: file
- path: artifacts/ads1115-analog-input.kicad_pro
  kind: file
contract_version: '2.0'
requirements:
- id: completed-schematic-exists
  description: Produce every required submission artifact.
  layer: deliverable
  critical: true
  check: completed_schematic_exists
- id: project-rules-unchanged
  description: Preserve the declared protected starter interface and project files.
  layer: integrity
  critical: true
  check: project_rules_unchanged
- id: component-and-net-contract
  description: Satisfy the declared native schematic component and net contract.
  layer: logical
  critical: true
  check: component_and_net_contract
- id: pin-connectivity
  description: Satisfy the independently exported electrical netlist contract.
  layer: logical
  critical: true
  check: pin_connectivity
- id: clean-erc
  description: Pass KiCad electrical-rules checking without errors or warnings.
  layer: electrical
  critical: true
  check: clean_erc
checks:
- type: artifact_presence
  name: completed_schematic_exists
- type: starter_integrity
  name: project_rules_unchanged
  protected_globs:
  - artifacts/ads1115-analog-input.kicad_pro
- type: kicad_schematic_structure
  name: component_and_net_contract
  schematic: artifacts/ads1115-analog-input.kicad_sch
  min_symbols: 6
  min_wires: 0
  exact_references: true
  components:
  - reference: U1
    value: ADS1115IDGS
    footprint: Package_SO:TSSOP-10_3x3mm_P0.5mm
    library: Analog_ADC:ADS1115IDGS
  - reference: R1
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
    library: Device:R
  - reference: R2
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
    library: Device:R
  - reference: R3
    value: 10k
    footprint: Resistor_SMD:R_0603_1608Metric
    library: Device:R
  - reference: C1
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
    library: Device:C
  - reference: J1
    value: Conn_01x10
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x10_P2.54mm_Vertical
    library: Connector_Generic:Conn_01x10
  required_nets:
  - GND
  - ALERT
  - AIN0
  - AIN1
  - AIN2
  - AIN3
  - 3V3
  - SDA
  - SCL
- type: kicad_netlist_contract
  name: pin_connectivity
  schematic: artifacts/ads1115-analog-input.kicad_sch
  exact_references: true
  components:
  - reference: U1
    value: ADS1115IDGS
    footprint: Package_SO:TSSOP-10_3x3mm_P0.5mm
  - reference: R1
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R2
    value: 4.7k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: R3
    value: 10k
    footprint: Resistor_SMD:R_0603_1608Metric
  - reference: C1
    value: 100nF
    footprint: Capacitor_SMD:C_0603_1608Metric
  - reference: J1
    value: Conn_01x10
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x10_P2.54mm_Vertical
  pin_nets:
    U1.1: GND
    U1.2: ALERT
    U1.3: GND
    U1.4: AIN0
    U1.5: AIN1
    U1.6: AIN2
    U1.7: AIN3
    U1.8: 3V3
    U1.9: SDA
    U1.10: SCL
    R1.1: 3V3
    R1.2: SDA
    R2.1: 3V3
    R2.2: SCL
    R3.1: 3V3
    R3.2: ALERT
    C1.1: 3V3
    C1.2: GND
    J1.1: 3V3
    J1.2: GND
    J1.3: SDA
    J1.4: SCL
    J1.5: ALERT
    J1.6: AIN0
    J1.7: AIN1
    J1.8: AIN2
    J1.9: AIN3
    J1.10: GND
- type: kicad_erc
  name: clean_erc
  schematic: artifacts/ads1115-analog-input.kicad_sch
